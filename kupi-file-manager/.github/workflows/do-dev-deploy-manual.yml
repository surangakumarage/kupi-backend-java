name: DEV-Digital ocean manual deploy file service

on:
  workflow_dispatch:


jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Cache local Maven repository
      uses: actions/cache@v4
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'

    - name: Build with Maven
      run: mvn clean install -DskipTests 

    - name: List built JARs
      run: ls -lh target

    - name: Stop existing service and clean up
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.DEV_SERVER }}
        username: ${{ secrets.USERNAME }}
        port: ${{ secrets.PORT }}
        key: ${{ secrets.KEY }}
        script: |
          echo "Stopping kupi-file-service if running..."
          pm2 delete file-service || echo "No PM2 process found"
          lsof -i :8083 && kill $(lsof -t -i:8083) || echo "Port 8083 not in use"
          rm -rf /opt/kupi/file-service/*
          

    - name: Copy Artifact via SCP to dev server
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.DEV_SERVER }}
        username: ${{ secrets.USERNAME }}
        port: ${{ secrets.PORT }}
        key: ${{ secrets.KEY }}
        source: "target/kupi-file-manager-service-0.0.1-SNAPSHOT.jar"
        target: "/opt/kupi/file-service"

    - name: Start kupi-file-service on dev server
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.DEV_SERVER }}
        username: ${{ secrets.USERNAME }}
        port: ${{ secrets.PORT }}
        key: ${{ secrets.KEY }}
        script: |
          cd /opt/kupi/file-service/target
          export DB_USERNAME=${{ secrets.DEV_DB_USER }}
          export DB_PASSWORD=${{ secrets.DEV_DB_PASS }}
          export DO_ACCESS_KEY=${{ secrets.DO_ACCESS_KEY_DEV }}
          export DO_SECRET_KEY=${{ secrets.DO_SECRET_KEY_DEV }}
          export DO_REGION=syd1
          export DO_ENDPOINT=${{ secrets.DO_ENDPOINT_DEV }}
          export STORAGE_PROVIDER=do
          pm2 start "java -jar kupi-file-manager-service-0.0.1-SNAPSHOT.jar" --name file-service || pm2 restart file-service
