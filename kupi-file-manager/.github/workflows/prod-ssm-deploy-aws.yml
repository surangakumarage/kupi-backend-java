name: PROD-SSM-AWS-manual-deploy-file-service

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # =========================
      # Cache Maven
      # =========================
      - name: Cache local Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # =========================
      # Set up JDK
      # =========================
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      # =========================
      # Build
      # =========================
      - name: Build with Maven
        run: mvn clean install -DskipTests

      - name: List built JARs
        run: ls -lh target

      # =========================
      # Create .env
      # =========================
      - name: Create .env file
        uses: SpicyPizza/create-envfile@v2.0
        with:
          envkey_DB_USERNAME: ${{ secrets.PROD_DB_USER }}
          envkey_DB_PASSWORD: ${{ secrets.PROD_DB_PASS }}
          envkey_DB_URL: ${{ secrets.DB_URL_PROD }}
          envkey_AWS_ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID_PROD }}
          envkey_AWS_SECRET_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY_PROD }}
          envkey_AWS_REGION: us-east-1
          envkey_AWS_BUCKET_NAME: ${{ secrets.AWS_BUCKET_NAME_PROD }}
          envkey_STORAGE_PROVIDER: aws
          envkey_LOGPATH: /opt/kupi/tmp/logs
          file_name: .env
          fail_on_empty: false
          sort_keys: false

      # =========================
      # Create deploy.sh
      # =========================
      - name: Create deploy.sh
        run: |
          cat << 'EOF' > deploy.sh
          #!/bin/bash
          set -e

          APP_DIR=/opt/kupi/file-service
          JAR_NAME=kupi-file-manager-service-0.0.1-SNAPSHOT.jar
          PORT=8083

          echo "Stopping existing service..."
          pm2 delete file-service || echo "No PM2 process found"

          rm -f $APP_DIR/$JAR_NAME || true

          if lsof -i :$PORT >/dev/null 2>&1; then
            kill $(lsof -t -i:$PORT)
          else
            echo "Port $PORT not in use"
          fi

          cd $APP_DIR || exit 1

          echo "Downloading artifacts..."
          aws s3 cp s3://kupi-prod-build-artifacts/file-service/$JAR_NAME $APP_DIR/
          aws s3 cp s3://kupi-prod-build-artifacts/file-service/.env $APP_DIR/.env

          echo "Loading environment variables..."
          set -a
          source .env
          set +a

          echo "Starting service with PM2..."
          pm2 start java --name file-service -- -jar $JAR_NAME
          pm2 save
          EOF

          chmod +x deploy.sh

      # =========================
      # AWS OIDC
      # =========================
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::071540691318:role/prod-ec2-secrets-access-role
          aws-region: us-east-1

      # =========================
      # Upload artifacts to S3
      # =========================
      - name: Upload artifacts to S3
        run: |
          aws s3 cp target/kupi-file-manager-service-0.0.1-SNAPSHOT.jar \
            s3://kupi-prod-build-artifacts/file-service/kupi-file-manager-service-0.0.1-SNAPSHOT.jar \
            --acl bucket-owner-full-control

          aws s3 cp .env \
            s3://kupi-prod-build-artifacts/file-service/.env \
            --acl bucket-owner-full-control

          aws s3 cp deploy.sh \
            s3://kupi-prod-build-artifacts/file-service/deploy.sh \
            --acl bucket-owner-full-control

      # =========================
      # Deploy via SSM
      # =========================
      - name: Deploy File Service via SSM
        run: |
          aws ssm send-command \
            --targets "Key=instanceIds,Values=${{ secrets.PROD_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy file-service" \
            --parameters '{
              "commands": [
                "aws s3 cp s3://kupi-prod-build-artifacts/file-service/deploy.sh /opt/kupi/file-service/deploy.sh",
                "chmod +x /opt/kupi/file-service/deploy.sh",
                "sudo -u devops /opt/kupi/file-service/deploy.sh"
              ]
            }' \
            --region us-east-1
