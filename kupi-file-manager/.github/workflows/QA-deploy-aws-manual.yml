name: QA-AWS-Manual deploy file service

on:
  workflow_dispatch:


jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Cache local Maven repository
      uses: actions/cache@v4
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'

    - name: Build with Maven
      run: mvn clean install -DskipTests 

    - name: List built JARs
      run: ls -lh target

    - name: Stop existing service and clean up
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.QA_SERVER }}
        username: ${{ secrets.QA_USERNAME }}
        port: ${{ secrets.QA_PORT }}
        key: ${{ secrets.QA_PRIVATE_KEY }}
        script: |
          echo "Stopping kupi-file-service if running..."
          pm2 delete file-service || echo "No PM2 process found"
          lsof -i :8083 && kill $(lsof -t -i:8083) || echo "Port 8083 not in use"
          rm -rf /opt/kupi/file-service/*
          

    - name: Copy Artifact via SCP to QA server
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.QA_SERVER }}
        username: ${{ secrets.QA_USERNAME }}
        port: ${{ secrets.QA_PORT }}
        key: ${{ secrets.QA_PRIVATE_KEY }}
        source: "target/kupi-file-manager-service-0.0.1-SNAPSHOT.jar"
        target: "/opt/kupi/file-service"

    - name: Start kupi-file-service on QA server
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.QA_SERVER }}
        username: ${{ secrets.QA_USERNAME }}
        port: ${{ secrets.QA_PORT }}
        key: ${{ secrets.QA_PRIVATE_KEY }}
        script: |
          cd /opt/kupi/file-service/target
          export DB_USERNAME=${{ secrets.QA_DB_USER }}
          export DB_PASSWORD=${{ secrets.QA_DB_PASS }}
          export DB_URL=${{ secrets.DB_URL_QA }}
          export AWS_ACCESS_KEY=${{ secrets.AWS_ACCESS_KEY_ID_QA }}
          export AWS_SECRET_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY_QA }}
          export AWS_REGION=us-east-1
          export AWS_BUCKET_NAME=${{ secrets.AWS_BUCKET_NAME_QA }}
          export STORAGE_PROVIDER=aws
          export LOGPATH=/opt/kupi/tmp/logs
          pm2 start "java -jar kupi-file-manager-service-0.0.1-SNAPSHOT.jar" --name file-service || pm2 restart file-service
