#deploy to kupi development
name: Build and deploy to kupi development server

on:
  workflow_dispatch:
 
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    
    - name: Set up JDK 11
      uses: actions/setup-java@v1
      with:
        java-version: 11

    - name: Build with Maven
      #run: mvn -B clean install --file pom.xml
      run: mvn clean compile package -DskipTests

    - name: Copy Artifact via scp to aws server
      uses: appleboy/scp-action@master
      env:
        HOST: ${{ secrets.DEV_SERVER }}
        USERNAME: ${{ secrets.USERNAME }}
        PORT: ${{ secrets.PORT }}
        KEY: ${{ secrets.KEY }}
      with:
        source: "./target/kupi-file-manager-service-0.0.1-SNAPSHOT.jar"
        target: "/home/ubuntu/kupi/services"

    - name: Executing remote command to run the service
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.DEV_SERVER }}
        USERNAME: ${{ secrets.USERNAME }}
        PORT: ${{ secrets.PORT }}
        KEY: ${{ secrets.KEY }}
        envs:
          DB_USERNAME:${{ secrets.DEV_DB_USER }}
          DB_PASSWORD:${{ secrets.DEV_DB_PASS }}
          AWS_ACCESS_KEY_ID:${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY:${{ secrets.AWS_SECRET_ACCESS_KEY }}
        #script_stop: true
        script: |
          cd /home/ubuntu/kupi/services/
          sudo su
          NOW=$(date +"%m-%d-%Y-%H-%M")
          declare -i pid
          unset pid
          pid=$(lsof -t -i tcp:8083 -s tcp:listen)
          sudo lsof -t -i tcp:8083 -s tcp:listen | sudo xargs kill
            while [ "$( ps -p ${pid} >/dev/null 2>&1; echo $?)" == "0" ]
            do
              sleep 10s
            done
          mv kupi-file-manager-service-0.0.1-SNAPSHOT.jar ../logs/bkp/kupi-file-manager-service-0.0.1-SNAPSHOT.jar.$NOW
          mv ../logs/file-manager-service.log ../logs/bkp/file-manager-service.log.$NOW
          mv target/kupi-file-manager-service-0.0.1-SNAPSHOT.jar .
          rm -rf /home/ubuntu/tmp/logs/file-service/*
          export GOOGLE_APPLICATION_CREDENTIALS=${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}
          export DB_USERNAME=${{ secrets.DEV_DB_USER }}
          export DB_PASSWORD=${{ secrets.DEV_DB_PASS }}
          export AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
          export AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
          export AWS_REGION=ap-southeast-1
          export AWS_BUCKET_NAME=objects-kupi-dev
          nohup java -jar kupi-file-manager-service-0.0.1-SNAPSHOT.jar > ../logs/file-manager-service.log 2>&1 &
          rm -rf target

  notify:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v2
      # this is the new step using the ms-teams-notification action
      - name: Notify dedicated teams channel
        uses: jdcargile/ms-teams-notification@v1.3
        with:
          github-token: ${{ github.token }} # this will use the runner's token.
          ms-teams-webhook-uri: ${{ secrets.TEAMS_WEBHOOK }}
          # ms-teams-webhook-uri: ${{ secrets.TEAMS_WEBHOOK }}
          notification-summary: Build and deployment to the Kupi dev server went smoothly!  &#x2705;
          notification-color: 17b81c
          timezone: asia/kolkata
