name: DEV-Digital ocean manual deploy auth service

on:
  workflow_dispatch:


jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Cache local Maven repository
      uses: actions/cache@v4
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'

    - name: Build with Maven
      run: mvn clean install -DskipTests 

    - name: List built JARs
      run: ls -lh target

    - name: Stop existing service and clean up
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.DEV_SERVER }}
        username: ${{ secrets.USERNAME }}
        port: ${{ secrets.PORT }}
        key: ${{ secrets.KEY }}
        script: |
          echo "Stopping kupi-auth-service if running..."
          pm2 delete auth-service || echo "No PM2 process found"
          lsof -i :8081 && kill $(lsof -t -i:8081) || echo "Port 8081 not in use"
          rm -rf /opt/kupi/auth-service/*
          

    - name: Copy Artifact via SCP to QA server
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.DEV_SERVER }}
        username: ${{ secrets.USERNAME }}
        port: ${{ secrets.PORT }}
        key: ${{ secrets.KEY }}
        source: "target/kupi-auth-service-0.0.1-SNAPSHOT.jar"
        target: "/opt/kupi/auth-service"

    - name: Start kupi-auth-service on QA server
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.DEV_SERVER }}
        username: ${{ secrets.USERNAME }}
        port: ${{ secrets.PORT }}
        key: ${{ secrets.KEY }}
        script: |
          cd /opt/kupi/auth-service/target
          export GOOGLE_APPLICATION_CREDENTIALS=${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}
          export DB_USERNAME=${{ secrets.DEV_DB_USER }}
          export DB_PASSWORD=${{ secrets.DEV_DB_PASS }}
          pm2 start "java -jar kupi-auth-service-0.0.1-SNAPSHOT.jar" --name auth-service || pm2 restart auth-service
