REJECT-MERCHANT-PROFILE-UPDATE-BODY=Hi <MERCHANT-NAME>,\nThis is to inform that your profile update has been rejected. Kindly resubmit with valid information or contact out support team for more details.\nThis is a system generated email. Please do not reply.\n\nThank you,\n\nkupi Team