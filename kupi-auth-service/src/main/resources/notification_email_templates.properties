APPROVE-MERCHANT-SUBJECT=kupi <ROLE-TYPE> Account Approval
APPROVE-MERCHANT-BODY=Hi <MERCHANT-NAME>,\nThis is to inform that your account has been approved and eligible to post deals in kupi.\nThis is a system generated email. Please do not reply.\n \nThank you,\n \nkupi Team

REJECT-MERCHANT-SUBJECT=kupi <ROLE-TYPE> Account Rejection
REJECT-MERCHANT-BODY=Hi <MERCHANT-NAME>,\nThis is to inform that your account has been rejected. Kindly signup again with valid information or \ncontact out support team for more details.\nThis is a system generated email. Please do not reply.\n\nThank you,\n\nkupi Team

BLOCK-MERCHANT-SUBJECT=kupi <ROLE-TYPE> Profile Block Notification
BLOCK-MERCHANT-BODY=Hi <MERCHANT-NAME>,\n\nThis is to inform that your profile is suspended temporally. Please contact our support team to get more details and reactivate your profile.\nThis is a system generated email. Please do not reply.\n\nThank you,\n\nkupi Team

UNBLOCK-MERCHANT-SUBJECT=kupi <ROLE-TYPE> Profile Unblock Notification
UNBLOCK-MERCHANT-BODY=Hi <MERCHANT-NAME>,\n\nThis is to inform that your profile has been reactivated.\nThis is a system generated email. Please do not reply.\n\nThank you,\n\nkupi Team

