name: UAT-Digital ocean manual deploy core service

on:
  workflow_dispatch:


jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Cache local Maven repository
      uses: actions/cache@v4
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'

    - name: Build with Maven
      run: mvn clean install -DskipTests 

    - name: List built JARs
      run: ls -lh target

    - name: Stop existing service and clean up
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.UAT_SERVER }}
        username: ${{ secrets.UAT_USERNAME }}
        port: ${{ secrets.UAT_PORT }}
        key: ${{ secrets.UAT_PRIVATE_KEY }}
        script: |
          echo "Stopping kupi-core-service if running..."
          pm2 delete core-service || echo "No PM2 process found"
          lsof -i :8084 && kill $(lsof -t -i:8084) || echo "Port 8084 not in use"
          rm -rf /opt/kupi/core-service/*
          

    - name: Copy Artifact via SCP to UAT server
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.UAT_SERVER }}
        username: ${{ secrets.UAT_USERNAME }}
        port: ${{ secrets.UAT_PORT }}
        key: ${{ secrets.UAT_PRIVATE_KEY }}
        source: "target/kupi-core-service-0.0.1-SNAPSHOT.jar"
        target: "/opt/kupi/core-service"

    - name: Start kupi-core-service on UAT server
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.UAT_SERVER }}
        username: ${{ secrets.UAT_USERNAME }}
        port: ${{ secrets.UAT_PORT }}
        key: ${{ secrets.UAT_PRIVATE_KEY }}
        script: |
          cd /opt/kupi/core-service/target
          export GOOGLE_APPLICATION_CREDENTIALS=${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_UAT }}
          export DB_USERNAME=${{ secrets.UAT_DB_USER }}
          export DB_PASSWORD=${{ secrets.UAT_DB_PASS }}
          export LOGPATH=/opt/kupi/tmp/logs
          export SAVE_LOCATION=/opt/kupi/tmp/csv
          export DEFAULT_PLAN_NAME=Welcome Offer 
          pm2 start "java -jar kupi-core-service-0.0.1-SNAPSHOT.jar" --name core-service || pm2 restart core-service
