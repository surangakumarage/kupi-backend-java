
name: QA-AWS-manual-deploy-phase-1
on:
  workflow_dispatch:


jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Cache local Maven repository
      uses: actions/cache@v4
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'

    - name: Build with Maven
      run: mvn clean install -DskipTests 

    - name: List built JARs
      run: ls -lh target

    - name: Stop existing service and clean up
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.QA_SERVER }}
        username: ${{ secrets.QA_USERNAME }}
        port: ${{ secrets.QA_PORT }}
        key: ${{ secrets.QA_PRIVATE_KEY }}
        script: |
          echo "Stopping kupi-location-service if running..."
          pm2 delete location-service || echo "No PM2 process found"
          lsof -i :8087 && kill $(lsof -t -i:8087) || echo "Port 8087 not in use"
          rm -rf /opt/kupi/location-service/*
          
    - name: Copy Artifact via SCP to Dev server
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.QA_SERVER }}
        username: ${{ secrets.QA_USERNAME }}
        port: ${{ secrets.QA_PORT }}
        key: ${{ secrets.QA_PRIVATE_KEY }}
        source: "target/kupi-location-service-0.0.1-SNAPSHOT.jar"
        target: "/opt/kupi/location-service"

    - name: Start kupi-location-service on Dev server
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.QA_SERVER }}
        username: ${{ secrets.QA_USERNAME }}
        port: ${{ secrets.QA_PORT }}
        key: ${{ secrets.QA_PRIVATE_KEY }}
        script: |
          cd /opt/kupi/location-service/target
          export GOOGLE_APPLICATION_CREDENTIALS=${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_QA }}
          export DB_URL=${{ secrets.DB_URL_QA }}
          export DB_USERNAME=${{ secrets.QA_DB_USER }}
          export DB_PASSWORD=${{ secrets.QA_DB_PASS }}
          export REDIS_HOST=${{ secrets.REDIS_HOST_QA }}
          export PROJECT=${{secrets.QA_PUBSUB_PROJECT}}
          export SEARCH_RADIUS_KM=${{secrets.QA_SEARCH_RADIUS_KM}}
          export REDIS_TIME_TO_LIVE=${{secrets.QA_REDIS_TIME_TO_LIVE}}
          export MOVEMENT_THRESHOLD_KM=${{secrets.QA_MOVEMENT_THRESHOLD_KM}}
          export LOGPATH=/opt/kupi/tmp/logs
          pm2 start "java -jar kupi-location-service-0.0.1-SNAPSHOT.jar" --name location-service || pm2 restart location-service
