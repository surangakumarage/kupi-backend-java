
name: UAT-Digital ocean manual deploy location service

on:
  workflow_dispatch:


jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Cache local Maven repository
      uses: actions/cache@v4
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'

    - name: Build with Maven
      run: mvn clean install -DskipTests 

    - name: List built JARs
      run: ls -lh target

    - name: Stop existing service and clean up
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.UAT_SERVER }}
        username: ${{ secrets.UAT_USERNAME }}
        port: ${{ secrets.UAT_PORT }}
        key: ${{ secrets.UAT_PRIVATE_KEY }}
        script: |
          echo "Stopping kupi-location-service if running..."
          pm2 delete location-service || echo "No PM2 process found"
          lsof -i :8087 && kill $(lsof -t -i:8087) || echo "Port 8087 not in use"
          rm -rf /opt/kupi/location-service/*
          
    - name: Copy Artifact via SCP to UAT server
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.UAT_SERVER }}
        username: ${{ secrets.UAT_USERNAME }}
        port: ${{ secrets.UAT_PORT }}
        key: ${{ secrets.UAT_PRIVATE_KEY }}
        source: "target/kupi-location-service-0.0.1-SNAPSHOT.jar"
        target: "/opt/kupi/location-service"

    - name: Start kupi-location-service on UAT server
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.UAT_SERVER }}
        username: ${{ secrets.UAT_USERNAME }}
        port: ${{ secrets.UAT_PORT }}
        key: ${{ secrets.UAT_PRIVATE_KEY }}
        script: |
          cd /opt/kupi/location-service/target
          export GOOGLE_APPLICATION_CREDENTIALS=${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_UAT }}
          export DB_USERNAME=${{ secrets.UAT_DB_USER }}
          export DB_PASSWORD=${{ secrets.UAT_DB_PASS }}
          export SEARCH_RADIUS_KM=${{secrets.UAT_SEARCH_RADIUS_KM}}
          export MOVEMENT_THRESHOLD_KM=${{secrets.UAT_MOVEMENT_THRESHOLD_KM}}
          export REDIS_TIME_TO_LIVE=${{secrets.UAT_REDIS_TIME_TO_LIVE}}
          export LOGPATH=/opt/kupi/tmp/logs
          pm2 start "java -jar kupi-location-service-0.0.1-SNAPSHOT.jar" --name location-service || pm2 restart location-service
