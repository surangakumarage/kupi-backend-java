#deploy to kupi
name: Build and deploy to kupi QA server

on:
  workflow_dispatch:
  push:
    branches: [ qa ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - name: Set up JDK 11
        uses: actions/setup-java@v1
        with:
          java-version: 11

      - name: Build with Maven
        #run: mvn -B clean install --file pom.xml
        run: mvn clean compile package -DskipTests

      - name: Copy Artifact via scp to aws server
        uses: appleboy/scp-action@master
        env:
          HOST: ${{ secrets.QA_SERVER }}
          USERNAME: ${{ secrets.USERNAME }}
          PORT: ${{ secrets.PORT }}
          KEY: ${{ secrets.KEY }}
        with:
          source: "./target/kupi-notification-service-0.0.1-SNAPSHOT.jar"
          target: "/home/ubuntu/kupi/services"

      - name: Executing remote command to run the service
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.QA_SERVER }}
          USERNAME: ${{ secrets.USERNAME }}
          PORT: ${{ secrets.PORT }}
          KEY: ${{ secrets.KEY }}
          envs:
            DB_USERNAME:${{ secrets.QA_DB_USER }}
            DB_PASSWORD:${{ secrets.QA_DB_PASS }}
            GOOGLE_APPLICATION_CREDENTIALS:${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}
          #script_stop: true
          script: |
            cd /home/ubuntu/kupi/services/
            sudo su
            NOW=$(date +"%m-%d-%Y-%H-%M")
            declare -i pid
            unset pid
            pid=$(lsof -t -i tcp:8086 -s tcp:listen)
            sudo lsof -t -i tcp:8086 -s tcp:listen | sudo xargs kill
              while [ "$( ps -p ${pid} >/dev/null 2>&1; echo $?)" == "0" ]
              do
                sleep 10s
              done
            mv kupi-notification-service-0.0.1-SNAPSHOT.jar ../logs/bkp/kupi-notification-service-0.0.1-SNAPSHOT.jar.$NOW
            mv ../logs/notification-service.log ../logs/bkp/notification-service.log.$NOW
            mv target/kupi-notification-service-0.0.1-SNAPSHOT.jar .
            rm -rf /home/ubuntu/tmp/logs/core-service/*
            export GOOGLE_APPLICATION_CREDENTIALS=${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}
            export DB_USERNAME=${{ secrets.QA_DB_USER }}
            export DB_PASSWORD=${{ secrets.QA_DB_PASS }}
            nohup java -jar kupi-notification-service-0.0.1-SNAPSHOT.jar > ../logs/notification-service.log 2>&1 &
            rm -rf target

  notify:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v2
      # this is the new step using the ms-teams-notification action
      - name: Notify dedicated teams channel
        uses: jdcargile/ms-teams-notification@v1.3
        with:
          github-token: ${{ github.token }} # this will use the runner's token.
          ms-teams-webhook-uri: ${{ secrets.TEAMS_WEBHOOK }}
          # ms-teams-webhook-uri: ${{ secrets.TEAMS_WEBHOOK }}
          notification-summary: Build and deployment to the Kupi QA server went smoothly!  &#x2705;
          notification-color: a317b8
          timezone: America/Denver
