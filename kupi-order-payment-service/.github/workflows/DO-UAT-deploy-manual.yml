name: UAT-Digital ocean manual deploy order payment service

on:
  workflow_dispatch:


jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Cache local Maven repository
      uses: actions/cache@v4
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'

    - name: Build with Maven
      run: mvn clean install -DskipTests 

    - name: List built JARs
      run: ls -lh target

    - name: Stop existing service and clean up
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.UAT_SERVER }}
        username: ${{ secrets.UAT_USERNAME }}
        port: ${{ secrets.UAT_PORT }}
        key: ${{ secrets.UAT_PRIVATE_KEY }}
        script: |
          echo "Stopping kupi-order-payment-service if running..."
          pm2 delete order-payment-service || echo "No PM2 process found"
          lsof -i :8088 && kill $(lsof -t -i:8088) || echo "Port 8088 not in use"
          rm -rf /opt/kupi/order-payment-service/*
          
    - name: Copy Artifact via SCP to UAT server
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.UAT_SERVER }}
        username: ${{ secrets.UAT_USERNAME }}
        port: ${{ secrets.UAT_PORT }}
        key: ${{ secrets.UAT_PRIVATE_KEY }}
        source: "target/kupi-order-payment-service-0.0.1-SNAPSHOT.jar"
        target: "/opt/kupi/order-payment-service"

    - name: Start kupi-order-payment-service on UAT server
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.UAT_SERVER }}
        username: ${{ secrets.UAT_USERNAME }}
        port: ${{ secrets.UAT_PORT }}
        key: ${{ secrets.UAT_PRIVATE_KEY }}
        script: |
          cd /opt/kupi/order-payment-service/target
          export GOOGLE_APPLICATION_CREDENTIALS=${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_UAT }}
          export DB_USERNAME=${{ secrets.UAT_DB_USER }}
          export DB_PASSWORD=${{ secrets.UAT_DB_PASS }}
          export LOGPATH=/opt/kupi/tmp/logs
          export SUBSCRIPTION_CAPTURE_URL=https://uat.kupi.lk/paymentcomplete
          export SUBSCRIPTION_CANCEL_URL=https://uat.kupi.lk/paymentcancel
          pm2 start "java -jar kupi-order-payment-service-0.0.1-SNAPSHOT.jar" --name order-payment-service || pm2 restart order-payment-service
