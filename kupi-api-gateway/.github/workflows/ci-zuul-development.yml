name: Build and deploy API Gateway to development server

on:
  workflow_dispatch:
  

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2
    - name: Cache local Maven repository
      uses: actions/cache@v2
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-

    - name: Set up JDK 11
      uses: actions/setup-java@v1
      with:
        java-version: 11
    - name: Build with Maven
      #run: mvn -B clean install --file pom.xml
      run: mvn clean compile package -DskipTests

    - name: Copy Artifact via scp to server
      uses: appleboy/scp-action@master
      env:
        HOST: ${{ secrets.DEV_SERVER }}
        USERNAME: ${{ secrets.USERNAME }}
        PORT: ${{ secrets.PORT }}
        KEY: ${{ secrets.KEY }}
      with:
        source: "./target/kupi-api-gateway-0.0.1-SNAPSHOT.jar"
        target: "/home/ubuntu/kupi/services/"

    - name: Executing remote command to run the service
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.DEV_SERVER }}
        USERNAME: ${{ secrets.USERNAME }}
        PORT: ${{ secrets.PORT }}
        KEY: ${{ secrets.KEY }}
        envs:
          DBPass:${{ secrets.DBPASSDEV }}
        #script_stop: true
        script: |
          cd /home/ubuntu/kupi/services/
          NOW=$(date +"%m-%d-%Y-%H-%M")
          declare -i pid
          unset pid
          pid=$(lsof -t -i tcp:8080 -s tcp:listen)
          sudo lsof -t -i tcp:8080 -s tcp:listen | sudo xargs kill
            while [ "$( ps -p ${pid} >/dev/null 2>&1; echo $?)" == "0" ]
            do
              sleep 10s
            done
          mv kupi-api-gateway-0.0.1-SNAPSHOT.jar ../logs/bkp/kupi-api-gateway-0.0.1-SNAPSHOT.jar.$NOW
          mv ../logs/api-gateway.log ../logs/bkp/api-gateway.log.$NOW
          mv target/kupi-api-gateway-0.0.1-SNAPSHOT.jar .
          rm -rf /home/ubuntu/tmp/logs/api-gateway/*
          nohup java -jar kupi-api-gateway-0.0.1-SNAPSHOT.jar > ../logs/api-gateway.log 2>&1 &
          rm -rf target

  notify:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v2
      # this is the new step using the ms-teams-notification action
      - name: Notify dedicated teams channel
        uses: jdcargile/ms-teams-notification@v1.3
        with:
          github-token: ${{ github.token }} # this will use the runner's token.
          ms-teams-webhook-uri: ${{ secrets.TEAMS_WEBHOOK }}
          # ms-teams-webhook-uri: ${{ secrets.TEAMS_WEBHOOK }}
          notification-summary: Build and deployment to the Kupi dev server went smoothly!  &#x2705;
          notification-color: 17b81c
          timezone: America/Denver
