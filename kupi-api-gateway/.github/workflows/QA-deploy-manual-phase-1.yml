name: QA-build-deploy-manual-phase-1

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Cache local Maven repository
      uses: actions/cache@v4
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'

    - name: Build with Maven
      run: mvn clean install -DskipTests

    - name: List built JARs
      run: ls -lh target

    - name: Executing remote command to run the service
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.QA_SERVER }}
        username: ${{ secrets.QA_USERNAME }}
        port: ${{ secrets.QA_PORT }}
        key: ${{ secrets.QA_PRIVATE_KEY }}
        script: |
          pm2 delete api-gateway-service
          lsof -i :8080 && kill $(lsof -t -i:8080) || echo "Port not in use"
          rm -rf /opt/kupi/api-gateway-service/*
          rm -rf /opt/kupi/api-gateway-service/*.
          
    - name: Copy Artifact via scp to server
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.QA_SERVER }}
        username: ${{ secrets.QA_USERNAME }}
        port: ${{ secrets.QA_PORT }}
        key: ${{ secrets.QA_PRIVATE_KEY }}
        source: "target/kupi-api-gateway-0.0.1-SNAPSHOT.jar"
        target: "/opt/kupi/api-gateway-service"

    - name: Executing remote command to run the service
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.QA_SERVER }}
        username: ${{ secrets.QA_USERNAME }}
        port: ${{ secrets.QA_PORT }}
        key: ${{ secrets.QA_PRIVATE_KEY }}
        script: |
          lsof -i :8080 && kill $(lsof -t -i:8080) || echo "Port not in use"
          cd /opt/kupi/api-gateway-service/target
          export LOGPATH=/opt/kupi/tmp/logs
          pm2 start "java -jar kupi-api-gateway-0.0.1-SNAPSHOT.jar" --name api-gateway-service || pm2 restart api-gateway-service
