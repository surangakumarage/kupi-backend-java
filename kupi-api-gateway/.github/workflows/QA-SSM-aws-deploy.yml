name: QA-SSM-AWS-manual-deploy-api-gateway

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Cache local Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build with Maven
        run: mvn clean install -DskipTests

      - name: List built JARs
        run: ls -lh target

      # =========================
      # Create .env file
      # =========================
      - name: Create .env file
        uses: SpicyPizza/create-envfile@v2.0
        with:
          envkey_LOGPATH: /opt/kupi/tmp/logs
          # Add more secrets if API Gateway needs them
          # envkey_DB_URL: ${{ secrets.DB_URL_QA }}
          # envkey_DB_USERNAME: ${{ secrets.QA_DB_USER }}
          # envkey_DB_PASSWORD: ${{ secrets.QA_DB_PASS }}
          file_name: .env
          fail_on_empty: false
          sort_keys: false

      # =========================
      # Create deploy.sh
      # =========================
      - name: Create deploy.sh
        run: |
          cat << 'EOF' > deploy.sh
          #!/bin/bash
          set -e
          APP_DIR=/opt/kupi/api-gateway-service
          JAR_NAME=kupi-api-gateway-0.0.1-SNAPSHOT.jar
          PORT=8080

          echo "Stopping existing service..."
          pm2 delete api-gateway-service || echo "No PM2 process found"

          if lsof -i :$PORT >/dev/null 2>&1; then
            kill $(lsof -t -i:$PORT)
          else
            echo "Port $PORT not in use"
          fi

          rm -f $APP_DIR/$JAR_NAME || true
          cd $APP_DIR || exit 1

          echo "Downloading artifacts..."
          aws s3 cp s3://kupi-qa-build-artifacts/api-gateway-service/$JAR_NAME $APP_DIR/
          aws s3 cp s3://kupi-qa-build-artifacts/api-gateway-service/.env $APP_DIR/.env

          echo "Loading environment variables safely..."
          while IFS='=' read -r key value; do
            [[ "$key" =~ ^#.*$ ]] && continue
            [[ -z "$key" ]] && continue
            export "$key=$value"
          done < .env

          echo "Starting service with PM2..."
          pm2 start java --name api-gateway-service -- \
          -javaagent:/opt/newrelic/newrelic.jar \
          -Dnewrelic.environment=qa \
          -Dnewrelic.config.app_name=api-gateway-service \
          -jar $APP_DIR/$JAR_NAME
          pm2 save
          EOF
          chmod +x deploy.sh

      # =========================
      # Configure AWS credentials
      # =========================
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::343218178358:role/qa-ec2-secrets-access-role
          aws-region: us-east-1

      # =========================
      # Upload artifacts to S3
      # =========================
      - name: Upload artifacts to S3
        run: |
          aws s3 cp target/kupi-api-gateway-0.0.1-SNAPSHOT.jar s3://kupi-qa-build-artifacts/api-gateway-service/ --acl bucket-owner-full-control
          aws s3 cp .env s3://kupi-qa-build-artifacts/api-gateway-service/ --acl bucket-owner-full-control
          aws s3 cp deploy.sh s3://kupi-qa-build-artifacts/api-gateway-service/ --acl bucket-owner-full-control

      # =========================
      # Deploy via SSM
      # =========================
      - name: Deploy API Gateway via SSM
        run: |
          aws ssm send-command \
            --targets "Key=instanceIds,Values=${{ secrets.QA_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy api-gateway-service" \
            --parameters '{
              "commands": [
                "aws s3 cp s3://kupi-qa-build-artifacts/api-gateway-service/deploy.sh /opt/kupi/api-gateway-service/deploy.sh",
                "chmod +x /opt/kupi/api-gateway-service/deploy.sh",
                "sudo -u devops /opt/kupi/api-gateway-service/deploy.sh"
              ]
            }' \
            --region us-east-1
