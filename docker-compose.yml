version: '3.8'

services:
  kupi-mysql:
    container_name: kupi-mysql
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    cpus: 0.5
    mem_limit: 500m
    restart: 'no'
    volumes:
      - ./mysql:/var/lib/mysql
      - ./db_dump:/db_dump
      - ./mysql-init:/docker-entrypoint-initdb.d
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}"
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  kupi-redis:
    container_name: kupi-redis
    image: redis:latest
    cpus: 0.2
    mem_limit: 100m
    restart: 'no'
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 20s
      retries: 10

volumes:
  mysql:
  db_dump:
