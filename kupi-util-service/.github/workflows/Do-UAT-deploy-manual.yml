
name: UAT-manual-deploy-phase-1

on:
  workflow_dispatch:


jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Cache local Maven repository
      uses: actions/cache@v4
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'

    - name: Build with Maven
      run: mvn clean install -DskipTests 

    - name: List built JARs
      run: ls -lh target

    - name: Stop existing service and clean up
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.UAT_SERVER }}
        username: ${{ secrets.UAT_USERNAME }}
        port: ${{ secrets.UAT_PORT }}
        key: ${{ secrets.UAT_PRIVATE_KEY }}
        script: |
          echo "Stopping kupi-util-service if running..."
          pm2 delete util-service || echo "No PM2 process found"
          lsof -i :8085 && kill $(lsof -t -i:8085) || echo "Port 8085 not in use"
          rm -rf /opt/kupi/util-service/*
          

    - name: Copy Artifact via SCP to QA server
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.UAT_SERVER }}
        username: ${{ secrets.UAT_USERNAME }}
        port: ${{ secrets.UAT_PORT }}
        key: ${{ secrets.UAT_PRIVATE_KEY }}
        source: "target/kupi-util-service-0.0.1-SNAPSHOT.jar"
        target: "/opt/kupi/util-service"

    - name: Start kupi-util-service on QA server
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.UAT_SERVER }}
        username: ${{ secrets.UAT_USERNAME }}
        port: ${{ secrets.UAT_PORT }}
        key: ${{ secrets.UAT_PRIVATE_KEY }}
        script: |
          cd /opt/kupi/util-service/target
          export WEBSMS_API_KEY=${{ secrets.WEBSMS_API_KEY }}
          export WEBSMS_API_TOKEN=${{ secrets.WEBSMS_API_TOKEN }}
          export WEBSMS_SENDER_ID=${{ secrets.WEBSMS_SENDER_ID }}
          export LOGPATH=/opt/kupi/tmp/logs
          export SES_SMTP_HOST=email-smtp.us-east-1.amazonaws.com
          export SES_SMTP_PORT=587
          export SES_SMTP_USERNAME=${{ secrets.SES_SMTP_USERNAME_QA }}
          export SES_SMTP_PASSWORD=${{ secrets.SES_SMTP_PASSWORD_QA }}
          export WHATSAPP_TOKEN=${{ secrets.WHATSAPP_TOKEN_PROD }}
          export AWS_EMAIL_SENDER=no-reply-qa@kupi.lk
          pm2 start "java -jar kupi-util-service-0.0.1-SNAPSHOT.jar" --name util-service || pm2 restart util-service
