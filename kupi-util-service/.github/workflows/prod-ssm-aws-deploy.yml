name: PROD-SSM-AWS-manual-deploy-util-service

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # =========================
      # Cache Maven
      # =========================
      - name: Cache local Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # =========================
      # Java Setup
      # =========================
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      # =========================
      # Build
      # =========================
      - name: Build with Maven
        run: mvn clean install -DskipTests

      - name: List built JARs
        run: ls -lh target

      # =========================
      # Create .env
      # =========================
      - name: Create .env file
        uses: SpicyPizza/create-envfile@v2.0
        with:
          envkey_SES_SMTP_USERNAME: ${{ secrets.SES_SMTP_USERNAME_PROD }}
          envkey_SES_SMTP_PASSWORD: ${{ secrets.SES_SMTP_PASSWORD_PROD }}
          envkey_SMS_API_KEY: ${{ secrets.SMS_API_KEY_PROD }}
          envkey_SMS_API_TOKEN: ${{ secrets.SMS_API_TOKEN_PROD }}
          envkey_WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN_PROD }}
          envkey_SMS_LOCAL_COUNTRY_CODE: ${{ secrets.SMS_LOCAL_COUNTRY_CODE_PROD }}
          envkey_LOGPATH: /opt/kupi/tmp/logs
          envkey_SES_SMTP_HOST: email-smtp.us-east-1.amazonaws.com
          envkey_SES_SMTP_PORT: 587
          envkey_AWS_EMAIL_SENDER: no-reply@kupi.lk
          file_name: .env
          fail_on_empty: false
          sort_keys: false

      # =========================
      # Create deploy.sh
      # =========================
      - name: Create deploy.sh
        run: |
          cat << 'EOF' > deploy.sh
          #!/bin/bash
          set -e

          APP_DIR=/opt/kupi/util-service
          JAR_NAME=kupi-util-service-0.0.1-SNAPSHOT.jar
          PORT=8085

          echo "Stopping existing service..."
          pm2 delete util-service || echo "No PM2 process found"

          rm -f $APP_DIR/$JAR_NAME || true

          if lsof -i :$PORT >/dev/null 2>&1; then
            kill $(lsof -t -i:$PORT)
          else
            echo "Port $PORT not in use"
          fi

          cd $APP_DIR || exit 1

          aws s3 cp s3://kupi-prod-build-artifacts/util-service/$JAR_NAME $APP_DIR/
          aws s3 cp s3://kupi-prod-build-artifacts/util-service/.env $APP_DIR/.env

          set -a
          source .env
          set +a

          pm2 start java --name util-service -- -jar $JAR_NAME
          pm2 save
          EOF

          chmod +x deploy.sh

      # =========================
      # AWS OIDC
      # =========================
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::071540691318:role/prod-ec2-secrets-access-role
          aws-region: us-east-1

      # =========================
      # Upload artifacts
      # =========================
      - name: Upload artifacts to S3
        run: |
          aws s3 cp target/kupi-util-service-0.0.1-SNAPSHOT.jar \
            s3://kupi-prod-build-artifacts/util-service/kupi-util-service-0.0.1-SNAPSHOT.jar \
            --acl bucket-owner-full-control

          aws s3 cp .env \
            s3://kupi-prod-build-artifacts/util-service/.env \
            --acl bucket-owner-full-control

          aws s3 cp deploy.sh \
            s3://kupi-prod-build-artifacts/util-service/deploy.sh \
            --acl bucket-owner-full-control

      # =========================
      # Deploy via SSM
      # =========================
      - name: Deploy Util service via SSM
        run: |
          aws ssm send-command \
            --targets "Key=instanceIds,Values=${{ secrets.PROD_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy util-service" \
            --parameters '{
              "commands": [
                "aws s3 cp s3://kupi-prod-build-artifacts/util-service/deploy.sh /opt/kupi/util-service/deploy.sh",
                "chmod +x /opt/kupi/util-service/deploy.sh",
                "sudo -u devops /opt/kupi/util-service/deploy.sh"
              ]
            }' \
            --region us-east-1
