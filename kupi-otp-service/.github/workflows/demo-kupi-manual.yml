name: DEMO AWS manual deploy OTP service

on:
  workflow_dispatch:


jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Cache local Maven repository
      uses: actions/cache@v4
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'

    - name: Build with Maven
      run: mvn clean install -DskipTests 

    - name: List built JARs
      run: ls -lh target

    - name: Stop existing service and clean up
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.DEMO_SERVER }}
        username: ${{ secrets.DEMO_USERNAME }}
        port: ${{ secrets.PORT }}
        key: ${{ secrets.DEMO_KEY }}
        script: |
          echo "Stopping kupi-otp-service if running..."
          pm2 delete otp-service || echo "No PM2 process found"
          lsof -i :8082 && kill $(lsof -t -i:8082) || echo "Port 8082 not in use"
          rm -rf /opt/kupi/services/target/kupi-otp-service-0.0.1-SNAPSHOT.jar
          

    - name: Copy Artifact via SCP to DEV server
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.DEMO_SERVER }}
        username: ${{ secrets.DEMO_USERNAME }}
        port: ${{ secrets.PORT }}
        key: ${{ secrets.DEMO_KEY }}
        source: "target/kupi-otp-service-0.0.1-SNAPSHOT.jar"
        target: "/opt/kupi/services"

    - name: Start kupi-OTP-service on DEV server
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.DEMO_SERVER }}
        username: ${{ secrets.DEMO_USERNAME }}
        port: ${{ secrets.PORT }}
        key: ${{ secrets.DEMO_KEY }}
        script: |
          cd /opt/kupi/services/target
          nohup java -DLOGPATH=/opt/kupi/services/logs -jar kupi-otp-service-0.0.1-SNAPSHOT.jar > /opt/kupi/services/logs/kupi-otp-service.log 2>&1 &
