name: PROD-Manual-Phase-1 deploy otp service

on:
  workflow_dispatch:


jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Cache local Maven repository
      uses: actions/cache@v4
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'

    - name: Build with Maven
      run: mvn clean install -DskipTests 

    - name: List built JARs
      run: ls -lh target

    - name: Stop existing service and clean up
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.PROD_SERVER }}
        username: ${{ secrets.PROD_USERNAME }}
        port: ${{ secrets.PROD_PORT }}
        key: ${{ secrets.PROD_PRIVATE_KEY }}
        script: |
          echo "Stopping kupi-otp-service if running..."
          pm2 delete otp-service || echo "No PM2 process found"
          lsof -i :8082 && kill $(lsof -t -i:8082) || echo "Port 8082 not in use"
          rm -rf /opt/kupi/otp-service/*
          

    - name: Copy Artifact via SCP to PROD server
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.PROD_SERVER }}
        username: ${{ secrets.PROD_USERNAME }}
        port: ${{ secrets.PROD_PORT }}
        key: ${{ secrets.PROD_PRIVATE_KEY }}
        source: "target/kupi-otp-service-0.0.1-SNAPSHOT.jar"
        target: "/opt/kupi/otp-service"

    - name: Start kupi-otp-service on PROD server
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.PROD_SERVER }}
        username: ${{ secrets.PROD_USERNAME }}
        port: ${{ secrets.PROD_PORT }}
        key: ${{ secrets.PROD_PRIVATE_KEY }}
        script: |
          cd /opt/kupi/otp-service/target
          export REDIS_HOST=${{ secrets.REDIS_HOST_PROD }}
          export LOGPATH=/opt/kupi/tmp/logs
          pm2 start "java -jar kupi-otp-service-0.0.1-SNAPSHOT.jar" --name otp-service || pm2 restart otp-service
