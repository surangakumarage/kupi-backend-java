name: QA-SSM-AWS-manual-deploy-otp-service

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # =========================
      # Cache Maven
      # =========================
      - name: Cache local Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # =========================
      # Set up JDK
      # =========================
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # =========================
      # Build
      # =========================
      - name: Build with Maven
        run: mvn clean install -DskipTests

      - name: List built JARs
        run: ls -lh target

      # =========================
      # Create .env
      # =========================
      - name: Create .env file
        uses: SpicyPizza/create-envfile@v2.0
        with:
          envkey_REDIS_HOST: ${{ secrets.REDIS_HOST_QA }}
          envkey_LOGPATH: /opt/kupi/tmp/logs
          file_name: .env
          fail_on_empty: false
          sort_keys: false

      # =========================
      # Create deploy.sh
      # =========================
      - name: Create deploy.sh
        run: |
          cat << 'EOF' > deploy.sh
          #!/bin/bash
          set -e

          APP_DIR=/opt/kupi/otp-service
          JAR_NAME=kupi-otp-service-0.0.1-SNAPSHOT.jar
          PORT=8082

          echo "Stopping existing service..."
          pm2 delete otp-service || echo "No PM2 process found"

          rm -f $APP_DIR/$JAR_NAME || true

          if lsof -i :$PORT >/dev/null 2>&1; then
            kill $(lsof -t -i:$PORT)
          else
            echo "Port $PORT not in use"
          fi

          cd $APP_DIR || exit 1

          echo "Downloading artifacts..."
          aws s3 cp s3://kupi-qa-build-artifacts/otp-service/$JAR_NAME $APP_DIR/
          aws s3 cp s3://kupi-qa-build-artifacts/otp-service/.env $APP_DIR/.env

          echo "Loading environment variables..."
          set -a
          source .env
          set +a

          echo "Starting service with PM2..."
          pm2 start java --name otp-service -- \
          -javaagent:/opt/newrelic/newrelic.jar \
          -Dnewrelic.environment=qa \
          -Dnewrelic.config.app_name=otp-service \
          -jar $APP_DIR/$JAR_NAME
          pm2 save
          EOF

          chmod +x deploy.sh

      # =========================
      # AWS OIDC
      # =========================
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::343218178358:role/qa-ec2-secrets-access-role
          aws-region: us-east-1

      # =========================
      # Upload artifacts to S3
      # =========================
      - name: Upload artifacts to S3
        run: |
          aws s3 cp target/kupi-otp-service-0.0.1-SNAPSHOT.jar \
            s3://kupi-qa-build-artifacts/otp-service/kupi-otp-service-0.0.1-SNAPSHOT.jar \
            --acl bucket-owner-full-control

          aws s3 cp .env \
            s3://kupi-qa-build-artifacts/otp-service/.env \
            --acl bucket-owner-full-control

          aws s3 cp deploy.sh \
            s3://kupi-qa-build-artifacts/otp-service/deploy.sh \
            --acl bucket-owner-full-control

      # =========================
      # Deploy via SSM
      # =========================
      - name: Deploy OTP Service via SSM
        run: |
          aws ssm send-command \
            --targets "Key=instanceIds,Values=${{ secrets.QA_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy otp-service" \
            --parameters '{
              "commands": [
                "aws s3 cp s3://kupi-qa-build-artifacts/otp-service/deploy.sh /opt/kupi/otp-service/deploy.sh",
                "chmod +x /opt/kupi/otp-service/deploy.sh",
                "sudo -u devops /opt/kupi/otp-service/deploy.sh"
              ]
            }' \
            --region us-east-1
