name: PROD-Phase-1-Manual-Build and Deploy

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Cache local Maven repository
      uses: actions/cache@v4
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'

    - name: Build with Maven
      run: mvn clean install -DskipTests

    - name: List built JARs
      run: ls -lh target

    - name: Executing remote command to run the service
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.PROD_SERVER }}
        username: ${{ secrets.PROD_USERNAME }}
        port: ${{ secrets.PROD_PORT }}
        key: ${{ secrets.PROD_PRIVATE_KEY }}
        script: |
          pm2 delete discovery-service
          lsof -i :8761 && kill $(lsof -t -i:8761) || echo "Port not in use"
          rm -rf /opt/kupi/discovery-service/*
          rm -rf /opt/kupi/discovery-service/*.
          

    - name: Copy Artifact via scp to server
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.PROD_SERVER }}
        username: ${{ secrets.PROD_USERNAME }}
        port: ${{ secrets.PROD_PORT }}
        key: ${{ secrets.PROD_PRIVATE_KEY }}
        source: "target/kupi-discovery-service-0.0.1-SNAPSHOT.jar"
        target: "/opt/kupi/discovery-service"

    - name: Executing remote command to run the service
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.PROD_SERVER }}
        username: ${{ secrets.PROD_USERNAME }}
        port: ${{ secrets.PROD_PORT }}
        key: ${{ secrets.PROD_PRIVATE_KEY }}
        script: |
          lsof -i :8761 && kill $(lsof -t -i:8761) || echo "Port not in use"
          cd /opt/kupi/discovery-service/target
          export LOGPATH=/opt/kupi/tmp/logs
          pm2 start "java -jar kupi-discovery-service-0.0.1-SNAPSHOT.jar" --name discovery-service || pm2 restart discovery-service
